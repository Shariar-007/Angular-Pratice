<h2>This is Home</h2>
<p>Welcome to the home page.</p>


<p [appHighlight]="'lightblue'">Hover over me — I light up.</p>
<p [appHighlight]="'yellow'">Hover me too — I default to yellow.</p>

<button (click)="visible = !visible">Toggle</button>
<p *appIf="visible">Now you see me (via our own structural directive!)</p>

<app-counter-display></app-counter-display>

<input
  type="text"
  placeholder="Search GitHub users..."
  (input)="onInput($any($event.target).value)">

<p *ngIf="loading">Loading...</p>

<ul>
  <li *ngFor="let user of results">
    <img [src]="user.avatar_url" width="24" height="24"> {{ user.login }}
  </li>
</ul>

<app-product></app-product>
